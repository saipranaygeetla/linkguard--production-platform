apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-test
  namespace: linkguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-test
  template:
    metadata:
      labels:
        app: memory-test
    spec:
      containers:
        - name: memory-test
          image: python:3.11-slim
          command:
            - python
            - -c
            - |
              data = []
              while True:
                  data.append("x" * 1024 * 1024)
          resources:
            requests:
              memory: "64Mi"
            limits:
              memory: "128Mi"