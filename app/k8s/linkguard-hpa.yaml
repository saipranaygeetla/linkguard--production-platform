apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: linkguard
  namespace: linkguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: linkguard

  minReplicas: 2
  maxReplicas: 5

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50