{{- if .Values.podDisruptionBudget.enabled }}

apiVersion: policy/v1
kind: PodDisruptionBudget

metadata:
  name: {{ include "linkguard-chart.fullname" . }}
  labels:
    {{- include "linkguard-chart.labels" . | nindent 4 }}

spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}

  selector:
    matchLabels:
      {{- include "linkguard-chart.selectorLabels" . | nindent 6 }}

{{- end }}